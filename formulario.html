<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="/pagina-processa-dados-do-form" method="post">
    <fieldset>
        <legend>Dados Gerais</legend>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" minlength="3" required><br><br>
        <label for="data_nascimento">Data de Nascimento:</label>
        <input type="date" id="data_nascimento" name="data_nascimento" required><br><br>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required><br><br>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>
    </fieldset>

    <fieldset>
        <legend>Endereço</legend>
        <label for="Tipo de Endereço">Tipo de Endereço:</label>
        <select id="tipo_endereco" name="tipo_endereco" required>
            <option value="">Selecione...</option>
            <option value="residencial">Residencial</option>
            <option value="comercial">Comercial</option>
        </select><br><br>
        <label for="Logradouro_endereço">Logradouro:</label>
        <input type="text" id="logradouro_endereco" name="logradouro_endereco" required><br><br>
        <label for="numero_endereco">Número:</label>
        <input type="text" id="numero_endereco" name="numero_endereco" required><br><br>
        <label for="complemento_endereco">Complemento(Caso Exista):</label>
        <input type="text" id="complemento_endereco" name="complemento_endereco"><br><br>
        <label for="cep_endereco">CEP:</label>
        <input type="text" id="cep_endereco" name="cep_endereco" pattern="\d{5}-\d{3}" required><br><br>
        </fieldset>
        <fieldset>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </fieldset>
    </body>

</html>
