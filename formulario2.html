<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário</title>

<style>
    /*aqui vai o CSS */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    /* Background Gradiente */
    background: linear-gradient(
        135deg,
        #4facfe 0%,
        #00f2fe 50%,
        #43e97b 100%
    );
}

form{
    width:100%;
    max-width:700px;
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

fieldset{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

legend{
    font-weight:bold;
    color:#333;
    padding:0 10px;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:15px;
}

label{
    margin-bottom:5px;
    font-weight:600;
    color:#444;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#4facfe;
    box-shadow:0 0 5px rgba(79,172,254,.5);
}

.botoes{
    display:flex;
    gap:10px;
    justify-content:center;
    border:none;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

button[type="submit"]{
    background:#28a745;
    color:white;
}

button[type="submit"]:hover{
    background:#218838;
}

button[type="reset"]{
    background:#dc3545;
    color:white;
}

button[type="reset"]:hover{
    background:#c82333;
}

/* Responsividade */
@media (max-width: 768px){
    form{
        padding:20px;
    }

    .botoes{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<form action="/pagina-processa-dados-do-form" method="post">

    <fieldset>
        <legend>Dados Gerais</legend>

        <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" minlength="3" required>
        </div>

        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>
        </div>

        <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf"
                   pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
        </div>

        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>
        </div>
    </fieldset>

    <fieldset>
        <legend>Endereço</legend>

        <div class="form-group">
            <label for="tipo_endereco">Tipo de Endereço:</label>
            <select id="tipo_endereco" name="tipo_endereco" required>
                <option value="">Selecione...</option>
                <option value="residencial">Residencial</option>
                <option value="comercial">Comercial</option>
            </select>
        </div>

        <div class="form-group">
            <label for="logradouro_endereco">Logradouro:</label>
            <input type="text" id="logradouro_endereco"
                   name="logradouro_endereco" required>
        </div>

        <div class="form-group">
            <label for="numero_endereco">Número:</label>
            <input type="text" id="numero_endereco"
                   name="numero_endereco" required>
        </div>

        <div class="form-group">
            <label for="complemento_endereco">
                Complemento (caso exista):
            </label>
            <input type="text" id="complemento_endereco"
                   name="complemento_endereco">
        </div>

        <div class="form-group">
            <label for="cep_endereco">CEP:</label>
            <input type="text" id="cep_endereco"
                   name="cep_endereco"
                   pattern="\d{5}-\d{3}" required>
        </div>
    </fieldset>

    <fieldset class="botoes">
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </fieldset>

</form>

</body>
</html>
